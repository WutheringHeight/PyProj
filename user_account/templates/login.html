{% load static %} {% load socialaccount %} <!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - House Designer</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .logo {
        font-size: 24px;
        font-weight: 800;
        color: #333;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .btn-social {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        color: #333;
        transition: 0.2s;
      }
      .btn-social:hover {
        background: #f9f9f9;
      }
      .btn-google {
        color: #db4437;
        border-color: #db4437;
      }
      .btn-facebook {
        color: #4267b2;
        border-color: #4267b2;
      }

      .divider {
        margin: 24px 0;
        border-top: 1px solid #eee;
        position: relative;
      }
      .divider span {
        background: white;
        padding: 0 10px;
        color: #999;
        font-size: 12px;
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
      }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: #1890ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      {% if messages %} {% for message in messages %}
      <p style="color: red; font-size: 14px">{{ message }}</p>
      {% endfor %} {% endif %}
      {% comment %} <a
        href="{% provider_login_url 'google' next='/home/' %}"
        class="btn-social btn-google"
      >
        <span style="margin-right: 10px">G</span> Tiếp tục với Google
      </a> {% endcomment %}
      <div class="divider"><span>HOẶC</span></div>
      <form method="POST" action="">
        {% csrf_token %}
        <input
          type="text"
          name="username"
          placeholder="Tên đăng nhập"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Mật khẩu"
          required
        />
        <button type="submit" class="btn-submit">Đăng nhập</button>
      </form>
      <p style="margin-top: 20px; font-size: 13px">
        Chưa có tài khoản?
        <a href="{% url 'signup' %}" style="color: #1890ff">Đăng ký ngay</a>
      </p>
    </div>
  </body>
</html>
