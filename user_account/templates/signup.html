<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký tài khoản</title>
  </head>
  <body>
    <div style="text-align: center; margin-top: 50px">
      <h2>Đăng ký tài khoản mới</h2>
      <form method="POST">
        {% csrf_token %} 
        {{ form.as_p }}
        <button type="submit">Đăng ký</button>
      </form>
      <p>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
    </div>
  </body>
</html>
