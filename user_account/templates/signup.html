{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - House Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* --- Cấu hình chung --- */
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f0f2f5; /* Màu nền xám xanh nhạt */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: #333;
      }

      /* --- Thẻ Card chứa form --- */
      .signup-card {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Đổ bóng nhẹ */
        text-align: center;
      }

      /* --- Tiêu đề --- */
      .signup-card h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 24px;
        font-weight: 700;
        color: #1a1a1a;
      }

      .signup-card .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
        display: block;
      }

      /* --- Form Django Styling --- */
      /* Django thường sinh ra các thẻ <p> bọc quanh input */
      form p {
        text-align: left;
        margin-bottom: 15px;
      }

      /* Nhãn (Label) */
      form label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 14px;
        color: #444;
      }

      /* Ô nhập liệu (Input) */
      form input[type="text"],
      form input[type="password"],
      form input[type="email"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box; /* Để padding không làm vỡ khung */
        transition: border-color 0.2s ease;
        font-family: inherit;
      }

      form input:focus {
        border-color: #1890ff; /* Màu xanh thương hiệu */
        outline: none;
        box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
      }

      /* Phần trợ giúp (Help text) của Django */
      .helptext {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
        display: block;
      }

      /* Danh sách lỗi (Error list) nếu nhập sai */
      .errorlist {
        color: #ff4d4f;
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
        font-size: 13px;
        text-align: left;
      }

      /* --- Nút Đăng ký --- */
      button[type="submit"] {
        width: 100%;
        padding: 14px;
        background: #1890ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.3s ease;
      }

      button[type="submit"]:hover {
        background: #096dd9;
      }

      /* --- Link chuyển trang --- */
      .footer-links {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .footer-links a {
        color: #1890ff;
        text-decoration: none;
        font-weight: 600;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    
    <div class="signup-card">
      <h2>Tạo tài khoản mới</h2>
      <span class="subtitle">Tham gia cộng đồng House Designer ngay hôm nay</span>

      <form method="POST">
        {% csrf_token %} 
        
        {{ form.as_p }}

        <button type="submit">Đăng ký</button>
      </form>

      <div class="footer-links">
        <p>Bạn đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập ngay</a></p>
      </div>
    </div>

  </body>
</html>
